[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pedersen-commitment-bulletproofs"
version = "2.0.0"
description = "Bulletproofs Non-Interactive Zero-Knowledge Range Proof & Confidential Asset Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
pedersen-commitment-bulletproofs = "bulletproofs_engine.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/pedersen-commitment-bulletproofs"
Repository = "https://github.com/abusuraihsakhri/pedersen-commitment-bulletproofs.git"
